services:
  - type: web
    name: trip-planner-api
    runtime: node
    buildCommand: npm install
    startCommand: node --loader tsx/esm server/dev.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
